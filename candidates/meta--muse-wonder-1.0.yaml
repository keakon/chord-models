notes: >-
  Officially released frontier coding model, currently in preview on Meta Model
  API and available in Muse Code. The API model ID is muse-wonder-1.0; Standard
  mode costs USD 4 per million uncached input tokens and USD 20 per million
  output tokens, with USD 0.20 cached input and no long-context premium.
  Contributor mode is not available on Model API. Official reasoning levels
  are minimal, low, medium, high, xhigh and max; omission uses a model-determined
  level, not a documented fixed default. Reasoning and visible text share the
  output budget. The hard output maximum remains unverified: the registry's
  131072 is a practical rate-limit-based choice, not a documented model cap;
  do not copy Muse Spark's output limit or infer an independent input cap.
  For sustained coding, a provisional Chord compaction starting point is
  threshold 0.70 and reminder 0.60, retaining room for tool results and
  reasoning. These are tunable recommendations, not provider limits or measured
  optima. Their token counts depend on the independently verified input cap or
  context-minus-output baseline; no absolute trigger is claimed while output
  capacity is unresolved. Candidate notes do not apply runtime configuration.
  Verify the hard output maximum and endpoint behavior before promotion.
