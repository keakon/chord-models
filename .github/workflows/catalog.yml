name: Catalog validation and discovery
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.x'
          cache: false # no go.sum here; the validator module is cached below
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Cache the pinned validator module
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: validator-${{ runner.os }}-${{ hashFiles('validator-revision') }}
          restore-keys: |
            validator-${{ runner.os }}-
      - name: Check data version on pull requests
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/check_version.py "$BASE_SHA"
      - name: Validate data with pinned Chord schema
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" == tag ]]; then
            export CATALOG_REVISION="$REF_NAME"
          fi
          export CATALOG_REPORT_PATH="$RUNNER_TEMP/catalog.json"
          scripts/validate.sh
      - name: Discover possible omissions
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/anomalyco/models.dev.git "$RUNNER_TEMP/models-dev"
          git -C "$RUNNER_TEMP/models-dev" sparse-checkout set models
          git -C "$RUNNER_TEMP/models-dev" rev-parse HEAD > discovery-source.txt
          python3 scripts/catalog_coverage.py --catalog "$RUNNER_TEMP/catalog.json" --models-dev "$RUNNER_TEMP/models-dev" --max-review-age 7 > coverage-report.json
      - name: Upload discovery report
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: catalog-discovery
          path: |
            coverage-report.json
            discovery-source.txt
          if-no-files-found: ignore
